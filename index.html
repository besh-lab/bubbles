<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>bubbles</title>

<!-- PWA: чтобы "Добавить на экран Домой" на iPhone открывало как приложение, без интерфейса Safari -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#131318" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="bubbles" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-512.png" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#EDEDED; --bg2:#FFFFFF; --text:#1C1C1E; --sub:#8A8A8E;
  --card:#FFFFFF; --border:#E3E3E5;
  --bubble-theirs:#FFFFFF; --bubble-theirs-border:#E3E3E5;
  --bubble-mine-default:#95EC69;   /* дефолтный "WeChat-зелёный", но юзер может выбрать любой */
  --accent:#07C160;                /* нейтральный акцент для кнопок/ссылок */
  --danger:#FA5151;
  --radius-avatar:8px; --radius-bubble:6px; --radius-card:12px;
}
[data-theme="dark"]{
  --bg:#131313; --bg2:#1C1C1E; --text:#F2F2F2; --sub:#8E8E93;
  --card:#1F1F21; --border:#2C2C2E;
  --bubble-theirs:#242426; --bubble-theirs-border:#2C2C2E;
  --bubble-mine-default:#2F7A3D;
  --accent:#2FCB6E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;}
::-webkit-scrollbar{width:0;height:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
img,video{max-width:100%;}

.screen{position:relative;min-height:100vh;}
.card{background:var(--card);border:1px solid var(--border);}

/* ---------- AUTH ---------- */
.auth-wrap{max-width:400px;margin:0 auto;padding:80px 20px;}
.auth-logo{font-weight:700;font-size:24px;text-align:center;letter-spacing:-.3px;}
.auth-tagline{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 24px;}
.auth-card{border-radius:var(--radius-card);padding:20px;}
.auth-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px;}
.auth-tab{flex:1;border:none;background:transparent;padding:9px;border-radius:6px;color:var(--sub);font-weight:600;font-size:13px;}
.auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);}
.input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;margin-bottom:10px;font-size:14px;}
.auth-error{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:4px;}
.btn-primary{border:none;background:var(--accent);color:#fff;font-weight:600;padding:12px;border-radius:8px;font-size:14px;}
.btn-primary.full{width:100%;}
.btn-primary:disabled{opacity:.4;}
.btn-secondary{border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;padding:12px;border-radius:8px;font-size:14px;}

/* ---------- SHELL ---------- */
.app-frame{max-width:460px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.top-header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;background:var(--card);border-bottom:1px solid var(--border);}
.brand{font-weight:700;font-size:17px;}
.top-actions{display:flex;gap:8px;}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text);}
.icon-btn:active{opacity:.6;}
.icon-btn i{width:17px;height:17px;}

.view{flex:1;overflow-y:auto;padding-bottom:70px;}
.view.full{padding:0;display:flex;flex-direction:column;overflow:hidden;}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--border);padding:11px 16px;color:var(--sub);font-size:14px;}
.search-bar i{width:15px;height:15px;}

/* ---------- LIST ---------- */
.list{display:flex;flex-direction:column;}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);background:var(--card);}
.list-row:active{background:var(--bg);}
.avatar{border-radius:var(--radius-avatar);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;}
.list-row-body{flex:1;min-width:0;}
.list-row-top{display:flex;justify-content:space-between;}
.list-row-name{font-weight:600;font-size:15px;}
.list-row-time{font-size:11px;color:var(--sub);}
.list-row-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.list-row-msg{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px;}
.unread-badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

/* ---------- CHAT ---------- */
.chat-header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;flex-shrink:0;border-bottom:1px solid var(--border);}
.chat-header-info{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.chat-header-name{font-weight:600;font-size:15px;}
.chat-header-sub{font-size:11px;color:var(--sub);}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg);}
.msg-row{display:flex;gap:6px;align-items:flex-end;}
.msg-row.mine{justify-content:flex-end;}
.msg-row.theirs{justify-content:flex-start;}
.msg-row .avatar{border-radius:6px;}
.msg{max-width:76%;display:flex;flex-direction:column;}
.msg.mine{align-items:flex-end;}
.msg.theirs{align-items:flex-start;}
.msg-sender{font-size:11px;color:var(--sub);margin:0 4px 2px;}
.date-separator{display:flex;justify-content:center;margin:10px 0 4px;}
.date-separator span{background:var(--card);border:1px solid var(--border);color:var(--sub);font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:12px;}
@keyframes msgEnter{ from{opacity:0;transform:translateY(8px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }
.msg-enter{animation:msgEnter .22s ease-out;}
.bubble{padding:9px 12px;border-radius:var(--radius-bubble);font-size:14.5px;word-break:break-word;border:1px solid transparent;}
.msg.mine .bubble{background:var(--bubble-mine-default);color:#1C1C1E;}
.msg.theirs .bubble{background:var(--bubble-theirs);border-color:var(--bubble-theirs-border);}
.bubble-time{font-size:10px;opacity:.6;margin-top:3px;text-align:right;}
.bubble-img{border-radius:var(--radius-bubble);max-width:220px;display:block;cursor:pointer;}
.bubble-circle{width:100px;height:100px;border-radius:var(--radius-bubble);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;background:var(--accent);cursor:pointer;}
.bubble-circle .play{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;}
.bubble-circle .dur{position:absolute;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:1px 7px;border-radius:8px;}
.bubble-file{display:flex;align-items:center;gap:10px;min-width:190px;}
.bubble-loc{width:200px;border-radius:var(--radius-bubble);overflow:hidden;border:1px solid var(--border);}
.bubble-loc .map-fake{height:80px;background:var(--accent);display:flex;align-items:center;justify-content:center;}

.attach-tray{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:var(--card);border-top:1px solid var(--border);}
.attach-opt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;padding:10px 4px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:10px;}
.chat-input-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;}
.chat-input-pill{flex:1;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;resize:none;font-family:inherit;line-height:20px;max-height:120px;padding:2px 0;}
.send-btn{background:var(--accent);color:#fff;border:none;}
.voice-btn{background:var(--accent);color:#fff;border:none;}
.voice-btn.recording{opacity:.6;}

/* ---------- PROFILE ---------- */
.profile-head{padding:24px 20px;text-align:center;background:var(--card);border-bottom:1px solid var(--border);}
.profile-avatar-wrap{position:relative;display:inline-block;}
.profile-avatar-edit{position:absolute;bottom:-4px;right:-4px;width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--card);}
.profile-name{font-weight:700;font-size:19px;margin-top:12px;}
.profile-username{font-size:13px;color:var(--sub);margin-top:2px;}
.profile-bio{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5;max-width:300px;margin-left:auto;margin-right:auto;}
.profile-actions{display:flex;gap:10px;margin-top:16px;}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;padding:6px 0 calc(env(safe-area-inset-bottom, 0px) + 6px);display:flex;justify-content:space-around;border-top:1px solid var(--border);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;padding:6px 20px;color:var(--sub);}
.nav-btn i{width:22px;height:22px;}
.nav-btn span{font-size:10px;font-weight:500;}
.nav-btn.active{color:var(--accent);}

/* ---------- MODALS ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.center{align-items:center;padding:16px;}
.modal-sheet{width:100%;max-width:460px;margin:0 auto;border-radius:14px 14px 0 0;padding:20px;background:var(--card);max-height:85vh;overflow-y:auto;}
.modal-sheet.card2{border-radius:14px;}
.modal-drag{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px;}

/* цветовая палитра — свободный выбор цвета */
.color-swatch{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.color-swatch.selected{border-color:var(--text);}
input[type="color"]{width:44px;height:34px;border-radius:8px;border:1px solid var(--border);padding:2px;background:var(--bg2);cursor:pointer;}

/* ---------- CALL SCREEN ---------- */
.call-screen{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 30px;background:#1C1C1E;color:#fff;}
.call-info,.call-avatar,.call-controls{position:relative;z-index:2;}
.call-avatar{width:110px;height:110px;border-radius:var(--radius-avatar);background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;}
.call-controls{display:flex;gap:20px;}
.call-btn{width:54px;height:54px;border-radius:12px;border:none;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;}
.call-btn.end{width:62px;height:62px;background:var(--danger);}
video.local-video{position:absolute;bottom:100px;right:16px;width:96px;height:130px;border-radius:8px;object-fit:cover;z-index:3;border:1px solid rgba(255,255,255,.3);transform:scaleX(-1);}
video.remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}

/* баннер входящего звонка на мобильных — сверху экрана, не блокирует остальной интерфейс */
.incoming-call-banner{
  position:fixed;top:0;left:0;right:0;z-index:300;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top, 12px) + 10px) 14px 12px;
  background:var(--card);border-bottom:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  animation:slideDownBanner .25s ease-out;
}
@keyframes slideDownBanner{ from{ transform:translateY(-100%); } to{ transform:translateY(0); } }

.hidden{display:none !important;}

.rec-indicator{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border-top:1px solid var(--border);font-weight:700;font-size:13px;color:var(--danger);}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:recPulse 1s infinite;flex-shrink:0;}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(0.8);}}

.toast{
  position:fixed;top:calc(env(safe-area-inset-top, 0px) + 16px);left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;
  font-size:13px;font-weight:600;z-index:400;box-shadow:0 4px 20px rgba(0,0,0,.25);
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{ from{opacity:0;transform:translateX(-50%) translateY(-10px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

/* реакции на сообщения */
.msg-reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.reaction-pill{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2px 7px;font-size:12px;cursor:pointer;}
.reaction-pill.mine{border-color:var(--accent);background:rgba(7,193,96,.1);}

/* меню действий над сообщением (долгое нажатие) */
.action-list{display:flex;flex-direction:column;}
.action-row{display:flex;align-items:center;gap:12px;padding:13px 6px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);cursor:pointer;}
.action-row:last-child{border-bottom:none;}
.action-row i{width:18px;height:18px;color:var(--sub);}

/* баннер ответа/редактирования над полем ввода */
.composer-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-top:1px solid var(--border);}
.composer-banner button{background:none;border:none;color:var(--sub);font-size:16px;padding:4px;}

/* цитата ответа внутри пузыря сообщения */
.reply-quote{border-left:3px solid rgba(0,0,0,0.2);padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(0,0,0,0.06);font-size:12.5px;}
.msg.mine .bubble.custom-accent .reply-quote{border-left-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);}

/* выбор участников группы */
.group-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
.group-check.checked{background:var(--accent);border-color:var(--accent);}
.group-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:800;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}

/* стикеры */
.bubble-sticker{width:110px;height:110px;object-fit:contain;cursor:pointer;background:transparent;}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:50vh;overflow-y:auto;}
.sticker-tile{position:relative;aspect-ratio:1;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px;}
.sticker-tile img{width:100%;height:100%;object-fit:contain;cursor:pointer;}
.sticker-delete{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--danger);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
.sticker-delete i{width:12px;height:12px;}

/* ---------- рамки аватарок ---------- */
.frame-picker-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.frame-pick{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px;border-radius:8px;border:2px solid transparent;}
.frame-pick.selected{border-color:var(--accent);}
.frame-pick img{width:52px;height:52px;}
.frame-pick span{font-size:10px;color:var(--sub);white-space:nowrap;}

/* ---------- холст профиля (просмотр) ---------- */
.canvas-scroll{background:#000;height:46vh;overflow-y:auto;border-top:1px solid var(--border);}
.canvas-board{position:relative;width:100%;}

/* ---------- редактор холста (полноэкранный) ---------- */
.canvas-editor-overlay{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;}
.canvas-editor-toolbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;}
.canvas-draw-tools{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;}
.draw-color{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.draw-color.selected{border-color:var(--accent);}
#canvas-editor-scroll{flex:1;overflow-y:auto;background:#000;}
#canvas-editor-board{position:relative;}
.canvas-item{position:absolute;touch-action:none;}
.canvas-item img{width:100%;height:100%;object-fit:cover;border-radius:6px;pointer-events:none;}
.canvas-item-delete{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
.canvas-item-resize{position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;border-radius:4px;background:var(--accent);cursor:nwse-resize;border:2px solid #fff;}
#canvas-draw-layer{touch-action:none;}

</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
</head>
<body>

<!-- ===================== AUTH ===================== -->
<div id="screen-auth" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo">bubbles</div>
    <p class="auth-tagline">Приватный мессенджер</p>
    <div class="card auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Вход</button>
        <button class="auth-tab" data-mode="register">Регистрация</button>
      </div>
      <div id="auth-register-fields" style="display:none">
        <input id="reg-name" class="input" placeholder="Имя" />
        <input id="reg-username" class="input" placeholder="Никнейм (без @)" />
      </div>
      <input id="auth-email" class="input" type="email" placeholder="Email" />
      <input id="auth-password" class="input" type="password" placeholder="Пароль" />
      <div id="auth-error" class="auth-error"></div>
      <button id="auth-submit" class="btn-primary full">Войти</button>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="screen" style="display:none">
  <div class="app-frame">

    <div id="top-header" class="top-header">
      <div class="brand">bubbles</div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-theme"><i data-lucide="moon"></i></button>
        <button class="icon-btn" id="btn-qr"><i data-lucide="qr-code"></i></button>
      </div>
    </div>

    <!-- ===== CHATS LIST ===== -->
    <div id="view-chats" class="view">
      <div class="search-bar" id="new-chat-trigger"><i data-lucide="search"></i><span>Найти по нику / новый чат</span></div>
      <div id="chats-list" class="list"></div>
    </div>

    <!-- ===== PROFILE ===== -->
    <div id="view-profile" class="view" style="display:none"></div>

    <!-- ===== CHAT DETAIL ===== -->
    <div id="view-chat-detail" class="view full" style="display:none">
      <div class="chat-header card">
        <button class="icon-btn" id="chat-back"><i data-lucide="chevron-left"></i></button>
        <div id="chat-header-info" class="chat-header-info"></div>
        <button class="icon-btn" id="chat-color-btn" title="Цвет чата"><i data-lucide="palette"></i></button>
        <button class="icon-btn" id="chat-call-audio"><i data-lucide="phone"></i></button>
        <button class="icon-btn" id="chat-call-video"><i data-lucide="video"></i></button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-attach-tray" class="attach-tray" style="display:none"></div>
      <div class="chat-input-row">
        <button class="icon-btn" id="btn-attach"><i data-lucide="plus"></i></button>

/* ==== js/push.js ==== */
/* ---------------- PUSH-УВЕДОМЛЕНИЯ (Firebase Cloud Messaging + Cloudflare Worker) ----------------

   Как это устроено (коротко):
   1. Каждое устройство пользователя при входе получает свой FCM-токен и кладёт его
      в users/{uid}.fcmTokens (массив — на телефоне и на компе будут разные токены).
   2. Когда приходит сообщение или звонок, отправитель сам достаёт токены получателя
      из Firestore (он и так может их читать) и просит Cloudflare Worker разослать пуш.
   3. Worker расписан отдельно (worker.js) — он и делает настоящий вызов Google FCM API,
      потому что для этого нужен секретный сервисный ключ, которому не место в браузере.

   ВАЖНО про iPhone: пуши в PWA работают только начиная с iOS 16.4+, и только если
   сайт добавлен на экран "Домой" (см. пункт 8) — обычная вкладка Safari пуши принимать
   не может, так уж устроено у Apple.
*/

const VAPID_KEY = "ВСТАВЬ_СЮДА"; // Firebase Console → Project settings → Cloud Messaging → Web Push certificates → Generate key pair
const PUSH_WORKER_URL = "ВСТАВЬ_СЮДА"; // адрес твоего Cloudflare Worker, напр. https://bubbles-push.твой-юзернейм.workers.dev

let messaging = null;

async function initPush(){
  if (!("Notification" in window) || !navigator.serviceWorker || !firebase.messaging) {
    console.log("Push-уведомления не поддерживаются этим браузером");
    return;
  }
  if (VAPID_KEY.startsWith("ВСТАВЬ") || PUSH_WORKER_URL.startsWith("ВСТАВЬ")) {
    console.log("Push-уведомления ещё не настроены (нет VAPID_KEY / PUSH_WORKER_URL)");
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    messaging = firebase.messaging();

    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      await db.collection("users").doc(currentUser.uid).update({
        fcmTokens: firebase.firestore.FieldValue.arrayUnion(token),
      });
    }

    // если приложение открыто и активно в момент прихода пуша — показываем тост внутри самого приложения
    messaging.onMessage((payload) => {
      const { title, body } = payload.notification || {};
      if (title || body) showToast(`${title || ""}${title && body ? " — " : ""}${body || ""}`);
    });
  } catch (err) {
    console.error("Не удалось настроить push-уведомления:", err);
  }
}

// достаёт токены получателя и просит Cloudflare Worker отправить пуш
async function sendPush(toUid, title, body, data){
  if (PUSH_WORKER_URL.startsWith("ВСТАВЬ")) return; // ещё не настроено — тихо пропускаем
  try {
    const doc = await db.collection("users").doc(toUid).get();
    const tokens = doc.data()?.fcmTokens || [];
    if (tokens.length === 0) return;
    await fetch(PUSH_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tokens, title, body, data: data || {} }),
    });
  } catch (err) {
    console.error("Ошибка отправки push:", err);
  }
}

/* ---------------- AUTH ---------------- */

let currentUser = null;   // firebase auth user
let myProfile = null;     // Firestore users/{uid} doc

const AVATAR_GRADIENTS = [
  "linear-gradient(135deg,#7C6CFF,#35D0BA)",
  "linear-gradient(135deg,#FF6FA5,#FFB86C)",
  "linear-gradient(135deg,#35D0BA,#4C8CFF)",
  "linear-gradient(135deg,#FFB86C,#FF6FA5)",
  "linear-gradient(135deg,#4C8CFF,#7C6CFF)",
];
function randomGrad(){ return AVATAR_GRADIENTS[Math.floor(Math.random()*AVATAR_GRADIENTS.length)]; }

let authMode = "login";

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".auth-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".auth-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      authMode = tab.dataset.mode;
      document.getElementById("auth-register-fields").style.display = authMode === "register" ? "block" : "none";
      document.getElementById("auth-submit").textContent = authMode === "register" ? "Создать аккаунт" : "Войти";
      document.getElementById("auth-error").textContent = "";
    });
  });

  document.getElementById("auth-submit").addEventListener("click", handleAuthSubmit);
  document.getElementById("auth-password").addEventListener("keydown", e => { if (e.key === "Enter") handleAuthSubmit(); });
});

async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";

  if (!email || !password) { errEl.textContent = "Заполни email и пароль"; return; }

  try {
    if (authMode === "register") {
      const name = document.getElementById("reg-name").value.trim();
      const username = document.getElementById("reg-username").value.trim().replace(/^@/, "");
      if (!name || !username) { errEl.textContent = "Заполни имя и никнейм"; return; }

      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await db.collection("users").doc(uid).set({
        uid, name, username: "@" + username, email,
        bio: "", grad: randomGrad(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (e) {
    errEl.textContent = translateAuthError(e.code);
  }
}

function translateAuthError(code){
  const map = {
    "auth/email-already-in-use": "Этот email уже зарегистрирован",
    "auth/invalid-email": "Неверный формат email",
    "auth/weak-password": "Пароль слишком слабый (минимум 6 символов)",
    "auth/user-not-found": "Пользователь не найден",
    "auth/wrong-password": "Неверный пароль",
    "auth/invalid-credential": "Неверный email или пароль",
  };
  return map[code] || "Ошибка: " + code;
}

function logout(){
  auth.signOut();
}

// главный слушатель состояния авторизации — управляет переключением экранов
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    try {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        myProfile = doc.data();
      } else {
        // документ профиля почему-то не нашёлся (гонка при регистрации, обрыв сети и т.п.) —
        // создаём заглушку вместо падения приложения
        myProfile = {
          uid: user.uid,
          name: user.email ? user.email.split("@")[0] : "Пользователь",
          username: "@user" + user.uid.slice(0, 5),
          email: user.email || "",
          bio: "", grad: randomGrad(),
        };
        await db.collection("users").doc(user.uid).set({
          ...myProfile,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        }).catch(err => console.error("Не удалось создать профиль-заглушку:", err));
      }
      document.getElementById("screen-auth").style.display = "none";
      document.getElementById("app").style.display = "block";
      initApp();
    } catch (err) {
      console.error("Ошибка загрузки профиля при входе:", err);
      // не оставляем пустой экран — даём знать и остаёмся на экране входа, чтобы можно было повторить
      document.getElementById("auth-error").textContent = "Не удалось загрузить профиль. Проверь связь и обнови страницу.";
    }
  } else {
    currentUser = null;
    myProfile = null;
    document.getElementById("screen-auth").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

/* ==== js/chats.js ==== */
/* ---------------- CHATS (Firestore) ----------------
   chats/{chatId}                : { type:'dm'|'group', members:[uid], name, grad, lastMsg, lastMsgTime, createdAt }
   chats/{chatId}/messages/{id}  : { senderId, senderName, type, text, mediaUrl, duration, isVideo,
                                      fileName, size, lat, lng, place, createdAt }
*/

let chatsUnsub = null;
let messagesUnsub = null;
let chatDocLiveUnsub = null;
let activeChatId = null;
let activeChatData = null;
let mediaRecorder = null;
let recordedChunks = [];
let lastMessages = [];

// быстрые пресеты + свободный выбор любого цвета через нативный color picker
const CHAT_COLOR_PRESETS = ["#95EC69","#7C6CFF","#4C8CFF","#FF6FA5","#FFB86C","#8A8A8E"];

function avatarInner(person){
  return person?.avatarUrl ? "" : initials(person?.name);
}
function avatarBg(person){
  return person?.avatarUrl ? `background-image:url('${person.avatarUrl}')` : `background:${person?.grad || randomGrad()}`;
}

function dmChatId(uidA, uidB){
  return [uidA, uidB].sort().join("_");
}

let chatsListenerInitialized = false;
const lastKnownMsgTime = {};

function listenMyChats(){
  if (chatsUnsub) chatsUnsub();
  chatsListenerInitialized = false;
  // без .orderBy() — так не нужен составной индекс Firestore; сортируем на клиенте
  chatsUnsub = db.collection("chats")
    .where("members", "array-contains", currentUser.uid)
    .onSnapshot(snap => {
      const chats = [];
      snap.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
      chats.sort((a, b) => (b.lastMsgTime?.toMillis?.() || 0) - (a.lastMsgTime?.toMillis?.() || 0));

      // звук уведомления — только после начальной загрузки, и только на реально новые чужие сообщения
      if (chatsListenerInitialized) {
        chats.forEach(c => {
          const t = c.lastMsgTime?.toMillis?.();
          const prev = lastKnownMsgTime[c.id];
          if (t && prev && t > prev && c.lastSenderId && c.lastSenderId !== currentUser.uid && c.id !== activeChatId) {
            playNotificationSound();
          }
        });
      }
      chats.forEach(c => { const t = c.lastMsgTime?.toMillis?.(); if (t) lastKnownMsgTime[c.id] = t; });
      chatsListenerInitialized = true;

      renderChatsList(chats);
    }, err => console.error("listenMyChats:", err));
}

let chatsRenderGen = 0;

async function renderChatsList(chats){
  const myGen = ++chatsRenderGen;
  const el = document.getElementById("chats-list");
  el.innerHTML = "";
  // дедупликация по id на всякий случай — если Firestore пришлёт снапшот с одним чатом дважды
  const seen = new Set();
  chats = chats.filter(c => { if (seen.has(c.id)) return false; seen.add(c.id); return true; });
  // "Избранное" всегда закреплено первым в списке
  chats.sort((a, b) => (a.type === "favorites" ? -1 : b.type === "favorites" ? 1 : 0));
  for (const chat of chats) {
    if (myGen !== chatsRenderGen) return; // более свежий рендер уже стартовал — этот прерываем
    let displayName = chat.name, personLike = { grad: chat.grad };
    let isFav = chat.type === "favorites";
    let isChannel = chat.type === "channel";
    if (chat.type === "dm") {
      const otherUid = chat.members.find(m => m !== currentUser.uid);
      const other = await getUserProfile(otherUid);
      if (myGen !== chatsRenderGen) return;
      displayName = displayNameFor(otherUid, other ? other.name : "Пользователь");
      personLike = other || { grad: randomGrad() };
    }
    const row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML = `
      ${isFav ? '<div class="avatar" style="width:46px;height:46px;font-size:16px;background:linear-gradient(135deg,#FFB86C,#FF6FA5)">🔖</div>' : isChannel ? '<div class="avatar" style="width:46px;height:46px;font-size:16px;background:linear-gradient(135deg,#4C8CFF,#7C6CFF)">📢</div>' : renderAvatar(personLike, 46)}
      <div class="list-row-body">
        <div class="list-row-top">
          <span class="list-row-name">${isFav ? "Избранное" : escapeHtml(displayName)}</span>
          <span class="list-row-time">${formatTime(chat.lastMsgTime)}</span>
        </div>
        <div class="list-row-bottom">
          <span class="list-row-msg">${chat.type==="group" ? '<i data-lucide="users" style="width:11px;height:11px;vertical-align:-1px"></i> ' : ""}${escapeHtml(chat.lastMsg || "")}</span>
        </div>
      </div>`;
    row.addEventListener("click", () => openChatDetail(chat.id));
    el.appendChild(row);
  }
  if (window.lucide) lucide.createIcons();
}

async function getUserProfile(uid){
  const doc = await db.collection("users").doc(uid).get();
  return doc.exists ? doc.data() : null;
}

/* ---------- ЛОКАЛЬНЫЕ ИМЕНА (алиасы) ---------- */

function displayNameFor(uid, fallbackName){
  return myProfile?.contactAliases?.[uid] || fallbackName || "Пользователь";
}

async function setContactAlias(uid, alias){
  const field = `contactAliases.${uid}`;
  if (alias && alias.trim()) {
    await db.collection("users").doc(currentUser.uid).update({ [field]: alias.trim() });
    myProfile.contactAliases = { ...(myProfile.contactAliases||{}), [uid]: alias.trim() };
  } else {
    await db.collection("users").doc(currentUser.uid).update({ [field]: firebase.firestore.FieldValue.delete() });
    if (myProfile.contactAliases) delete myProfile.contactAliases[uid];
  }
}

/* ---------- БЛОКИРОВКА ---------- */

function isBlocked(uid){
  return (myProfile?.blockedUids || []).includes(uid);
}

async function blockUser(uid){
  await db.collection("users").doc(currentUser.uid).update({ blockedUids: firebase.firestore.FieldValue.arrayUnion(uid) });
  myProfile.blockedUids = [...(myProfile.blockedUids || []), uid];
}

async function unblockUser(uid){
  await db.collection("users").doc(currentUser.uid).update({ blockedUids: firebase.firestore.FieldValue.arrayRemove(uid) });
  myProfile.blockedUids = (myProfile.blockedUids || []).filter(u => u !== uid);
}

async function openChatDetail(chatId){
  activeChatId = chatId;
  const doc = await db.collection("chats").doc(chatId).get();
  activeChatData = { id: chatId, ...doc.data() };
  replyingTo = null; editingMessageId = null;

  let headerName = activeChatData.name, otherUid = null, headerPerson = { grad: activeChatData.grad };
  let otherBlockedMe = false;
  if (activeChatData.type === "dm") {
    otherUid = activeChatData.members.find(m => m !== currentUser.uid);
    const other = await getUserProfile(otherUid);
    headerName = displayNameFor(otherUid, other?.name);
    headerPerson = other || {};
    activeChatData.otherUid = otherUid;
    activeChatData.otherPerson = other || {};
    otherBlockedMe = !!other?.blockedUids?.includes(currentUser.uid);
  } else if (activeChatData.type === "favorites") {
    headerName = "Избранное";
  }
  activeChatData.otherBlockedMe = otherBlockedMe;

  const isChannel = activeChatData.type === "channel";
  document.getElementById("chat-header-info").innerHTML = `
    ${activeChatData.type==="favorites" ? '<div class="avatar" style="width:38px;height:38px;font-size:14px;background:linear-gradient(135deg,#FFB86C,#FF6FA5)">🔖</div>' : isChannel ? '<div class="avatar" style="width:38px;height:38px;font-size:14px;background:linear-gradient(135deg,#4C8CFF,#7C6CFF)">📢</div>' : renderAvatar(headerPerson, 38)}
    <div>
      <div class="chat-header-name">${escapeHtml(headerName)}</div>
      <div class="chat-header-sub">${activeChatData.type==="group" ? (activeChatData.members.length+" участников") : isChannel ? (activeChatData.members.length+" подписчиков") : activeChatData.type==="favorites" ? "только вы" : (headerPerson.username||"")}</div>
    </div>`;

  document.getElementById("chat-color-btn").onclick = () => openChatCustomizeModal(chatId);
  const headerInfo = document.getElementById("chat-header-info");
  headerInfo.onclick = () => { if (otherUid) openContactProfile(otherUid); };

  const showCallBtns = activeChatData.type === "dm" ? "flex" : "none";
  document.getElementById("chat-call-audio").style.display = showCallBtns;
  document.getElementById("chat-call-video").style.display = showCallBtns;

  document.getElementById("channel-sub-btn")?.remove();
  if (isChannel) {
    const isSubscribed = activeChatData.members.includes(currentUser.uid);
    const isAdmin = activeChatData.ownerId === currentUser.uid || (activeChatData.admins||[]).includes(currentUser.uid);
    const btn = document.createElement("button");
    btn.id = "channel-sub-btn";
    btn.className = "btn-secondary";
    btn.style.cssText = "padding:6px 12px;font-size:12px;white-space:nowrap;flex-shrink:0";
    btn.textContent = isAdmin ? "Вы админ" : (isSubscribed ? "Отписаться" : "Подписаться");
    if (isAdmin) btn.disabled = true;
    else btn.addEventListener("click", async () => {
      if (isSubscribed) await unsubscribeFromChannel(chatId); else await subscribeToChannel(chatId);
      openChatDetail(chatId);
    });
    document.querySelector(".chat-header").insertBefore(btn, document.getElementById("chat-color-btn"));
  }

  showView("chat-detail");
  applyWallpaper(activeChatData.wallpaper);
  renderComposerBanner();
  renderBlockBanner();

  if (messagesUnsub) messagesUnsub();
  messagesUnsub = db.collection("chats").doc(chatId).collection("messages")
    .orderBy("createdAt", "asc")
    .onSnapshot(snap => {
      const msgs = [];
      snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
      lastMessages = msgs;
      renderMessages(msgs);
    });

  // живой листенер самого чата — нужен для обоев (реакция в реальном времени на "второй поставил тоже")
  let prevAcceptedCount = (activeChatData.wallpaper?.acceptedBy || []).length;
  if (chatDocLiveUnsub) chatDocLiveUnsub();
  chatDocLiveUnsub = db.collection("chats").doc(chatId).onSnapshot(snap => {
    const data = snap.data();
    if (!data) return;
    const wasSetByMe = activeChatData.wallpaper?.setBy === currentUser.uid;
    activeChatData = { ...activeChatData, ...data };
    applyWallpaper(data.wallpaper);
    const newAcceptedCount = (data.wallpaper?.acceptedBy || []).length;
    if (wasSetByMe && newAcceptedCount > prevAcceptedCount && data.wallpaper?.acceptedBy?.some(u => u !== currentUser.uid)) {
      showToast(`${data.wallpaper.setByName === myProfile.name ? "Собеседник" : ""} поставил(а) твои обои! 🎉`);
    }
    prevAcceptedCount = newAcceptedCount;
  });
}

/* ---------- ОБОИ ЧАТА ---------- */

function applyWallpaper(wallpaper){
  const el = document.getElementById("chat-messages");
  if (!el) return;
  const accepted = wallpaper && (wallpaper.acceptedBy || []).includes(currentUser.uid);
  if (accepted) {
    el.style.backgroundImage = `url('${wallpaper.url}')`;
    el.style.backgroundSize = "cover";
    el.style.backgroundPosition = "center";
  } else {
    el.style.backgroundImage = "";
  }
  renderWallpaperPrompt(wallpaper);
}

function renderWallpaperPrompt(wallpaper){
  document.getElementById("wallpaper-prompt")?.remove();
  if (!wallpaper) return;
  const alreadyAccepted = (wallpaper.acceptedBy || []).includes(currentUser.uid);
  const isMine = wallpaper.setBy === currentUser.uid;
  if (alreadyAccepted || isMine) return; // предлагать нечего — уже свои обои или сам их поставил

  const banner = document.createElement("div");
  banner.id = "wallpaper-prompt";
  banner.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);";
  banner.innerHTML = `
    <img src="${wallpaper.url}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0" />
    <div style="flex:1;font-size:12.5px;color:var(--sub)">${escapeHtml(wallpaper.setByName)} предложил(а) обои для чата</div>
    <button class="btn-secondary" style="padding:6px 10px;font-size:12px" id="wallpaper-decline">Не сейчас</button>
    <button class="btn-primary" style="padding:6px 10px;font-size:12px" id="wallpaper-accept">Поставить</button>`;
  document.getElementById("chat-messages").insertAdjacentElement("beforebegin", banner);
  document.getElementById("wallpaper-decline").addEventListener("click", () => banner.remove());
  document.getElementById("wallpaper-accept").addEventListener("click", () => acceptWallpaper());
}

async function acceptWallpaper(){
  await db.collection("chats").doc(activeChatId).update({
    "wallpaper.acceptedBy": firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
  });
  document.getElementById("wallpaper-prompt")?.remove();
}

async function setChatWallpaper(chatId, file){
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `chatWallpapers/${chatId}_${Date.now()}_${safeName}`;
  const url = await uploadToSupabase(path, file);
  await db.collection("chats").doc(chatId).update({
    wallpaper: { url, setBy: currentUser.uid, setByName: myProfile.name, acceptedBy: [currentUser.uid] },
  });
}

async function removeChatWallpaper(chatId){
  await db.collection("chats").doc(chatId).update({ wallpaper: firebase.firestore.FieldValue.delete() });
}

function showToast(text){

  document.body.appendChild(t);

}

async function setChatColor(chatId, color){
  await db.collection("chats").doc(chatId).update({ color: color || firebase.firestore.FieldValue.delete() });

let seenMessageIds = new Set();
let renderedForChatId = null;

async function renderMessages(msgs){
  const el = document.getElementById("chat-messages");
  const isChannel = activeChatData?.type === "channel";
  const isFirstRenderForThisChat = renderedForChatId !== activeChatId;
  if (isFirstRenderForThisChat) { seenMessageIds = new Set(); renderedForChatId = activeChatId; }

  // подгружаем профили отправителей группы заранее — чтобы аватарки рендерились синхронно
  if (activeChatData?.type === "group") {
    const uniqueSenders = [...new Set(msgs.map(m => m.senderId))].filter(id => id !== currentUser.uid);
    for (const uid of uniqueSenders) {
      if (!messageSenderCache[uid]) messageSenderCache[uid] = await getUserProfile(uid) || {};
    }
  }

  let hasNewIncoming = false;
  let lastDateStr = null;
  const pieces = [];
  for (const m of msgs) {
    const day = m.createdAt?.toDate ? m.createdAt.toDate() : new Date();
    const dateStr = day.toDateString();
    if (dateStr !== lastDateStr) {
      pieces.push(`<div class="date-separator"><span>${formatDateSeparator(day)}</span></div>`);
      lastDateStr = dateStr;
    }
    const isNew = !isFirstRenderForThisChat && !seenMessageIds.has(m.id);
    if (isNew && m.senderId !== currentUser.uid) hasNewIncoming = true;
    seenMessageIds.add(m.id);
    pieces.push(messageHtml(m, isNew));
  }
  el.innerHTML = pieces.join("");
  el.scrollTop = el.scrollHeight;
  if (window.lucide) lucide.createIcons();
  el.querySelectorAll(".msg[data-id]").forEach(node => {
    const m = msgs.find(x => x.id === node.dataset.id);
    if (m && !m.deleted) attachLongPress(node, () => openMessageActions(m));
  });

  if (hasNewIncoming && document.getElementById("view-chat-detail").style.display !== "none") {
    playNotificationSound();
  }
}

const MONTHS_RU = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function formatDateSeparator(date){
  const now = new Date();
  if (date.toDateString() === now.toDateString()) return "Сегодня";
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (date.toDateString() === yesterday.toDateString()) return "Вчера";
  const label = `${date.getDate()} ${MONTHS_RU[date.getMonth()]}`;
  return date.getFullYear() === now.getFullYear() ? label : `${label} ${date.getFullYear()}`;
}

const messageSenderCache = {};

function messageAvatarHtml(m, mine, isChannel){
  if (isChannel) {
    return `<div class="avatar" style="width:28px;height:28px;font-size:11px;background:linear-gradient(135deg,#4C8CFF,#7C6CFF);flex-shrink:0">📢</div>`;
  }
  let person;
  if (mine) person = myProfile;
  else if (activeChatData.type === "group") person = messageSenderCache[m.senderId] || {};
  else person = activeChatData.otherPerson || {};
  return renderAvatar(person, 28);
}

const QUICK_REACTIONS = ["❤️","😂","👍","😮","😢","🔥"];

function messageHtml(m, isNew){
  const isChannel = activeChatData?.type === "channel";
  const mine = !isChannel && m.senderId === currentUser.uid;
  const cls = mine ? "mine" : "theirs";
  const rowCls = `msg-row ${cls}${isNew ? " msg-enter" : ""}`;
  const sender = isChannel
    ? `<div class="msg-sender">📢 ${escapeHtml(activeChatData.name)}</div>`
    : (!mine && activeChatData?.type === "group" ? `<div class="msg-sender">${escapeHtml(m.senderName||"")}</div>` : "");
  const avatarHtml = messageAvatarHtml(m, mine, isChannel);

  if (m.deleted) {
    return `<div class="${rowCls}">${cls==="theirs"?avatarHtml:""}<div class="msg ${cls}" data-id="${m.id}"><div class="bubble" style="font-style:italic;color:var(--sub);background:var(--bubble-theirs)">Сообщение удалено</div></div>${cls==="mine"?avatarHtml:""}</div>`;
  }

  const accent = mine && activeChatData?.color ? activeChatData.color : null;
  const accentAttr = accent ? ` style="background:${accent}" class="bubble custom-accent"` : ` class="bubble"`;

  const replyHtml = m.replyTo ? `<div class="reply-quote">
      <div style="font-weight:700;font-size:11.5px;margin-bottom:1px">${escapeHtml(m.replyTo.senderName)}</div>
      <div style="opacity:.8">${escapeHtml(m.replyTo.preview)}</div>
    </div>` : "";
  const forwardedHtml = m.forwardedFrom ? `<div style="font-size:11px;color:var(--sub);margin-bottom:3px;display:flex;align-items:center;gap:4px"><i data-lucide="forward" style="width:11px;height:11px"></i> Переслано от ${escapeHtml(m.forwardedFrom.senderName)}</div>` : "";
  const editedHtml = m.edited ? `<span style="opacity:.6"> · изменено</span>` : "";

  let body = "";
  if (m.type === "text") {
    body = `<div${accentAttr}>${forwardedHtml}${replyHtml}${escapeHtml(m.text)}<div class="bubble-time">${formatTime(m.createdAt)}${editedHtml}</div></div>`;
  } else if (m.type === "image") {
    body = `<img class="bubble-img" src="${m.mediaUrl}" onclick="openMediaViewer('${m.mediaUrl}','image')" />`;
  } else if (m.type === "sticker") {
    body = `<img class="bubble-sticker" src="${m.mediaUrl}" onclick="openMediaViewer('${m.mediaUrl}','image')" />`;
  } else if (m.type === "file") {
    body = `<div class="bubble bubble-file"><i data-lucide="file-text"></i><div><div style="font-weight:600;font-size:13px">${escapeHtml(m.fileName)}</div><div style="font-size:11px;color:var(--sub)">${m.size||""}</div></div></div>`;
  } else if (m.type === "circle") {
    body = `<div class="bubble-circle" onclick="openMediaViewer('${m.mediaUrl}','${m.isVideo ? "circle-video" : "circle-audio"}')"><div class="play"><i data-lucide="play"></i></div><span class="dur">${m.duration||""}</span></div>`;
  } else if (m.type === "location") {
    body = `<div class="bubble bubble-loc"><div class="map-fake"><i data-lucide="map-pin" style="color:#fff"></i></div><div style="padding:8px 12px;font-size:12.5px">${escapeHtml(m.place||"Геолокация")}</div></div>`;
  }

  const reactionsHtml = renderReactionsRow(m);
  return `<div class="${rowCls}">${cls==="theirs"?avatarHtml:""}<div class="msg ${cls}" data-id="${m.id}">${sender}${body}${reactionsHtml}</div>${cls==="mine"?avatarHtml:""}</div>`;
}

function renderReactionsRow(m){
  const reactions = m.reactions || {};
  const counts = {};
  Object.values(reactions).forEach(emoji => { counts[emoji] = (counts[emoji]||0) + 1; });
  const entries = Object.entries(counts);
  if (entries.length === 0) return "";
  const myReaction = reactions[currentUser.uid];
  return `<div class="msg-reactions">${entries.map(([emoji, count]) => `
    <span class="reaction-pill ${myReaction===emoji ? "mine" : ""}" onclick="toggleReaction('${m.id}','${emoji}')">${emoji} ${count > 1 ? count : ""}</span>
  `).join("")}</div>`;
}

/* ---------- ДОЛГОЕ НАЖАТИЕ / ПРАВЫЙ КЛИК ---------- */

function attachLongPress(el, callback){
  let timer = null, moved = false, startX = 0, startY = 0;
  const start = (e) => {
    moved = false;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    timer = setTimeout(() => { if (!moved) callback(); }, 420);
  };
  const move = (e) => {
    const p = e.touches ? e.touches[0] : e;
    if (Math.abs(p.clientX - startX) > 10 || Math.abs(p.clientY - startY) > 10) { moved = true; clearTimeout(timer); }
  };
  const cancel = () => clearTimeout(timer);
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchmove", move, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("mousedown", start);
  el.addEventListener("mousemove", move);
  el.addEventListener("mouseup", cancel);
  el.addEventListener("mouseleave", cancel);
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); callback(); });
}

      <div class="action-list">

        <div class="action-row" id="act-forward"><i data-lucide="forward"></i> Переслать</div>
        <div class="action-row" id="act-favorite"><i data-lucide="bookmark"></i> В избранное</div>
        ${m.type === "text" ? `<div class="action-row" id="act-copy"><i data-lucide="copy"></i> Копировать</div>` : ""}
        ${mine && m.type === "text" ? `<div class="action-row" id="act-edit"><i data-lucide="pencil"></i> Изменить</div>` : ""}

    if (confirm("Удалить сообщение?")) await deleteMessage(m.id);
  });

/* ---------- РЕАКЦИИ ---------- */

async function toggleReaction(messageId, emoji){
  const ref = db.collection("chats").doc(activeChatId).collection("messages").doc(messageId);
  await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    const reactions = snap.data().reactions || {};
    if (reactions[currentUser.uid] === emoji) {
      delete reactions[currentUser.uid]; // повторный тап той же реакцией — снимает её
    } else {
      reactions[currentUser.uid] = emoji;
    }
    tx.update(ref, { reactions });
  });
}

/* ---------- ОТВЕТ (REPLY) ---------- */

let replyingTo = null;

function previewForMessage(m){
  if (m.deleted) return "Сообщение удалено";
  return m.text || { image: "📷 Фото", sticker: "🙂 Стикер", file: "📎 Файл", location: "📍 Геолокация",
    circle: m.isVideo ? "🎥 Видео-кружок" : "🎤 Голосовое" }[m.type] || "Сообщение";
}

function startReply(m){
  replyingTo = { id: m.id, preview: previewForMessage(m), senderName: m.senderId === currentUser.uid ? "Вы" : (m.senderName || "Собеседник") };
  renderComposerBanner();
}

function cancelReply(){ replyingTo = null; renderComposerBanner(); }

/* ---------- РЕДАКТИРОВАНИЕ ---------- */

let editingMessageId = null;

function startEdit(m){
  editingMessageId = m.id;
  replyingTo = null;
  const input = document.getElementById("chat-input");
  input.value = m.text || "";
  input.dispatchEvent(new Event("input"));
  input.focus();
  renderComposerBanner();
}

function cancelEdit(){
  editingMessageId = null;
  document.getElementById("chat-input").value = "";
  document.getElementById("chat-input").dispatchEvent(new Event("input"));
  renderComposerBanner();
}

async function saveEdit(newText){
  if (!newText.trim()) return;
  await db.collection("chats").doc(activeChatId).collection("messages").doc(editingMessageId).update({
    text: newText.trim(), edited: true,
  });
  editingMessageId = null;
  renderComposerBanner();
}

function renderComposerBanner(){
  document.getElementById("composer-banner")?.remove();

async function downloadFile(url, filename){

}

// перезаписывает видео-кружок покадрово через canvas, впечатывая водяной знак "bubbles" в кадр
async function saveCircleWithWatermark(url){
  const video = document.createElement("video");
  video.src = url;
  video.crossOrigin = "anonymous";
  video.muted = true;
  video.playsInline = true;
  await new Promise((res, rej) => { video.onloadedmetadata = res; video.onerror = () => rej(new Error("не удалось загрузить видео")); });

  const size = Math.min(video.videoWidth, video.videoHeight) || 320;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");

  // подмешиваем оригинальный звук ролика в новый поток через Web Audio API
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioCtx();
  const resp = await fetch(url);
  const arrayBuf = await resp.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuf.slice(0));
  const dest = audioCtx.createMediaStreamDestination();
  const bufferSrc = audioCtx.createBufferSource();
  bufferSrc.buffer = audioBuffer;
  bufferSrc.connect(dest);

  const canvasStream = canvas.captureStream(30);
  const combined = new MediaStream([...canvasStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);

  const mimeType = pickMimeType(true) || "video/webm";
  const recorder = mimeType ? new MediaRecorder(combined, { mimeType }) : new MediaRecorder(combined);
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const finished = new Promise(res => { recorder.onstop = res; });

  recorder.start();
  bufferSrc.start();
  await video.play();

  function drawFrame(){
    if (video.paused || video.ended) return;
    const ratio = Math.max(size / video.videoWidth, size / video.videoHeight);
    const w = video.videoWidth * ratio, h = video.videoHeight * ratio;
    ctx.drawImage(video, (size - w) / 2, (size - h) / 2, w, h);
    ctx.font = "700 15px Inter, sans-serif";
    ctx.textAlign = "right";
    ctx.shadowColor = "rgba(0,0,0,0.55)";
    ctx.shadowBlur = 5;
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText("bubbles", size - 14, size - 16);
    requestAnimationFrame(drawFrame);
  }
  drawFrame();

  await new Promise(res => { video.onended = res; });
  recorder.stop();
  await finished;

  const blob = new Blob(chunks, { type: mimeType.split(";")[0] });
  const blobUrl = URL.createObjectURL(blob);
  const ext = mimeType.includes("mp4") ? "mp4" : "webm";
  const a = document.createElement("a");
  a.href = blobUrl; a.download = `bubbles_circle_${Date.now()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
  audioCtx.close();
}

/* ---------- VOICE / VIDEO CIRCLE RECORDING ---------- */

let currentRecMimeType = "";

// Safari/iOS не умеет писать webm — подбираем формат, который реально поддерживается
function pickMimeType(isVideo){
  const candidates = isVideo
    ? ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    : ["audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/webm;codecs=opus", "audio/webm"];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return ""; // пусть браузер сам решит
}

// начинает запись поверх уже открытого стрима (используется для кружков — стрим уже показан в превью)
function startRecordingFromStream(stream, isVideo){
  recordedChunks = [];
  currentRecMimeType = pickMimeType(isVideo);
  try {
    mediaRecorder = currentRecMimeType ? new MediaRecorder(stream, { mimeType: currentRecMimeType }) : new MediaRecorder(stream);
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream); // на крайний случай — без явного mimeType
    currentRecMimeType = "";
  }
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start();
}

async function startRecording(isVideo){
  const constraints = isVideo ? { video: { width: 320, height: 320, facingMode: "user" }, audio: true } : { audio: true };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  startRecordingFromStream(stream, isVideo);
  return stream;
}

async function stopRecordingAndSend(isVideo, durationSec){
  return new Promise((resolve, reject) => {
    mediaRecorder.onstop = async () => {
      try {
        const mime = currentRecMimeType || (isVideo ? "video/mp4" : "audio/mp4");
        const ext = mime.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(recordedChunks, { type: mime.split(";")[0] });
        const file = new File([blob], `${isVideo?"video":"voice"}_${Date.now()}.${ext}`, { type: blob.type });
        const url = await uploadFileToChat(file);
        await addMessage({ type: "circle", mediaUrl: url, isVideo, duration: formatDuration(durationSec) });
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        resolve();
      } catch (err) {
        console.error("Ошибка отправки записи:", err);
        alert("Не получилось отправить запись: " + (err.message || err));
        reject(err);
      }
    };
    mediaRecorder.stop();
  });
}

function initials(name){ return (name||"").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }

function formatDuration(sec){ const m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${String(s).padStart(2,"0")}`; }
function formatTime(ts){
  if (!ts || !ts.toDate) return "";
  const d = ts.toDate();
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}

/* ==== js/calls.js ==== */
/* ---------------- CALLS (WebRTC + Firestore signaling) ----------------
   calls/{callId}: { callerId, calleeId, callerName, calleeName, type:'audio'|'video', status, offer, answer, createdAt }
   calls/{callId}/callerCandidates/{id}
   calls/{callId}/calleeCandidates/{id}

   ICE_SERVERS (STUN + твой TURN на Oracle Cloud) определены в firebase-init.js

   ЛОГИКА ЗВОНКА (одинаковая на любом устройстве — телефон, комп, любой браузер):
   1. Звонящий (A) создаёт RTCPeerConnection, получает свой микрофон/камеру,
      делает SDP-offer и кладёт его в новый документ calls/{id} со status:"ringing".
   2. У принимающего (B) на ВСЕХ его открытых вкладках/устройствах одновременно
      висит слушатель listenIncomingCalls() — он ловит документ по calleeId+"ringing"
      и показывает свою "звонилку" (баннер на мобиле, модалка на компе + звук).
   3. Когда B нажимает "принять": получает свой микрофон/камеру, ставит offer как
      remoteDescription, делает SDP-answer, пишет его в тот же документ, status:"accepted".
   4. A видит status:"accepted" → ставит answer как remoteDescription. Теперь у обеих
      сторон согласован формат медиа (SDP) — дело за доставкой сети (ICE).
   5. Параллельно с самого начала оба конца пишут свои ICE-кандидаты (варианты
      сетевых путей друг к другу) в подколлекции callerCandidates/calleeCandidates —
      это не блокирует основной обмен, идёт фоном. Firestore тут просто "почтовый
      ящик" для сигналинга — сам голос/видео идёт напрямую между устройствами (или
      через TURN, если напрямую не получилось) в обход Firestore.
   6. Если B не отвечает и решает не отвечать, или A передумал — статус меняют на
      "ended", это видят все стороны (в т.ч. другие устройства B, где баннер сам
      должен исчезнуть, раз звонок уже не "ringing").

   Разница между устройствами обрабатывается не веткой кода "если телефон/если комп",
   а вот чем:
   - UI звонилки разный (баннер сверху на мобиле vs модалка на компе) — только
     оформление, не логика.
   - Автовоспроизведение звука на iOS Safari блокируется без жеста пользователя —
     поэтому AudioContext создаётся один раз при первом тапе по странице и
     переиспользуется (см. unlockAudio ниже), а не создаётся заново на каждый звонок.
   - Сама WebRTC-логика (шаги 1-6) — общая, единая, независимо от устройства.
*/

let pc = null;
let localStream = null;
let activeCallId = null;
let incomingCallUnsub = null;
let callDocUnsub = null;

/* ---------- звук входящего звонка (важно: iOS блокирует автозвук без жеста юзера) ---------- */

let sharedAudioCtx = null;
function unlockAudio(){
  if (!sharedAudioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) sharedAudioCtx = new Ctx();
  }
  if (sharedAudioCtx && sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
}
document.addEventListener("click", unlockAudio, { once: true });
document.addEventListener("touchstart", unlockAudio, { once: true });

let ringInterval = null;
function playRingtone(){
  unlockAudio();
  if (!sharedAudioCtx) return; // AudioContext недоступен — звонок всё равно продолжит работать, просто без звука
  const beep = () => {
    if (!sharedAudioCtx) return;
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, sharedAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, sharedAudioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, sharedAudioCtx.currentTime + 0.4);
    osc.connect(gain).connect(sharedAudioCtx.destination);
    osc.start();
    osc.stop(sharedAudioCtx.currentTime + 0.4);
  };
  beep();
  setTimeout(beep, 500);
  ringInterval = setInterval(() => { beep(); setTimeout(beep, 500); }, 1800);
  if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
}
function stopRingtone(){
  if (ringInterval) clearInterval(ringInterval);
  ringInterval = null;
  if (navigator.vibrate) navigator.vibrate(0);
}

/* ---------- гудки ожидания у звонящего (пока собеседник не ответил) ---------- */

let ringbackInterval = null;
function playRingback(){
  unlockAudio();
  if (!sharedAudioCtx) return;
  const tone = () => {
    if (!sharedAudioCtx) return;
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 425; // классическая частота гудка
    gain.gain.setValueAtTime(0.001, sharedAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, sharedAudioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.15, sharedAudioCtx.currentTime + 0.95);
    gain.gain.exponentialRampToValueAtTime(0.001, sharedAudioCtx.currentTime + 1.0);
    osc.connect(gain).connect(sharedAudioCtx.destination);
    osc.start();
    osc.stop(sharedAudioCtx.currentTime + 1.0);
  };
  tone();
  ringbackInterval = setInterval(tone, 3000);
}
function stopRingback(){
  if (ringbackInterval) clearInterval(ringbackInterval);
  ringbackInterval = null;
}

/* ---------- звук нового сообщения — короткий "дзинь" из двух нот ---------- */

function playNotificationSound(){
  unlockAudio();
  if (!sharedAudioCtx) return;
  [880, 1175].forEach((freq, i) => {
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    const start = sharedAudioCtx.currentTime + i * 0.09;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);
    osc.connect(gain).connect(sharedAudioCtx.destination);
    osc.start(start);
    osc.stop(start + 0.26);
  });
}

function isMobileDevice(){
  return window.matchMedia("(pointer: coarse)").matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function listenIncomingCalls(){
  if (incomingCallUnsub) incomingCallUnsub();
  incomingCallUnsub = db.collection("calls")
    .where("calleeId", "==", currentUser.uid)
    .where("status", "==", "ringing")
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type === "added") {
          showIncomingCallUI({ id: change.doc.id, ...change.doc.data() });
        }
        if (change.type === "removed") {
          // документ перестал быть "ringing" — приняли на другом устройстве, отклонили или отменили
          const uiEl = document.getElementById("incoming-call-ui");
          if (uiEl && uiEl.dataset.callId === change.doc.id) dismissIncomingCallUI();
        }
      });
    });
}

/* ---------- исходящий звонок ---------- */

async function startCall(calleeUid, calleeName, calleeGrad, isVideo){
  try {
    pc = new RTCPeerConnection(ICE_SERVERS);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
  } catch (err) {
    console.error("Не удалось получить камеру/микрофон:", err);
    alert("Не получилось включить камеру/микрофон: " + (err.message || err));
    return;
  }
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  const callRef = db.collection("calls").doc();
  activeCallId = callRef.id;

  pc.onicecandidate = (e) => { if (e.candidate) callRef.collection("callerCandidates").add(e.candidate.toJSON()); };
  const remoteStream = new MediaStream();
  pc.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  showCallScreen({ name: calleeName, grad: calleeGrad, isVideo, remoteStream, localStream, outgoing: true });
  playRingback();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await callRef.set({
    callerId: currentUser.uid, callerName: myProfile.name,
    calleeId: calleeUid, calleeName,
    type: isVideo ? "video" : "audio", status: "ringing",
    offer: { sdp: offer.sdp, type: offer.type },
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

  callDocUnsub = callRef.onSnapshot(async (snap) => {
    const data = snap.data();
    if (!data) return;
    if (data.status === "accepted" && data.answer && pc.currentRemoteDescription === null) {
      stopRingback();
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
    if (data.status === "ended") { stopRingback(); endCall(false); }
  });

  callRef.collection("calleeCandidates").onSnapshot(snap => {
    snap.docChanges().forEach(c => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  });
}

/* ---------- приём звонка ---------- */

async function acceptCall(callId){
  dismissIncomingCallUI();
  const callRef = db.collection("calls").doc(callId);
  const callSnap = await callRef.get();
  const call = callSnap.data();
  if (!call || call.status !== "ringing") return; // уже приняли/отменили на другом устройстве

  try {
    pc = new RTCPeerConnection(ICE_SERVERS);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: call.type === "video" });
  } catch (err) {
    console.error("Не удалось получить камеру/микрофон:", err);
    alert("Не получилось включить камеру/микрофон: " + (err.message || err));
    await callRef.update({ status: "ended" }).catch(()=>{});
    return;
  }
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = (e) => { if (e.candidate) callRef.collection("calleeCandidates").add(e.candidate.toJSON()); };
  const remoteStream = new MediaStream();
  pc.ontrack = (e) => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  activeCallId = callId;
  showCallScreen({ name: call.callerName, grad: "linear-gradient(135deg,#7C6CFF,#35D0BA)", isVideo: call.type==="video", remoteStream, localStream, outgoing: false });

  await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await callRef.update({ status: "accepted", answer: { sdp: answer.sdp, type: answer.type } });

  callRef.collection("callerCandidates").onSnapshot(snap => {
    snap.docChanges().forEach(c => { if (c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  });

  callDocUnsub = callRef.onSnapshot(snap => { if (snap.data()?.status === "ended") endCall(false); });
}

function declineCall(callId){
  dismissIncomingCallUI();
  db.collection("calls").doc(callId).update({ status: "ended" }).catch(()=>{});
}

/* ---------- экран активного звонка ---------- */

function showCallScreen({ name, grad, isVideo, remoteStream, localStream, outgoing }){
  const el = document.createElement("div");
  el.id = "call-screen";
  el.className = "call-screen";
  el.style.background = grad;
  el.innerHTML = `
    ${isVideo ? `<video class="remote-video" autoplay playsinline></video><video class="local-video" autoplay playsinline muted></video>` : `<audio class="remote-audio" autoplay playsinline></audio>`}
    <div class="call-info" style="text-align:center;margin-top:20px">
      <div style="font-size:13px;color:rgba(255,255,255,.8)">${isVideo?"Видеозвонок":"Голосовой звонок"}</div>
      <h2 style="font-weight:800;font-size:26px;margin:6px 0">${escapeHtml(name)}</h2>
      <div id="call-timer" style="font-size:14px;color:rgba(255,255,255,.75)">${outgoing?"вызов...":"00:00"}</div>
    </div>
    ${!isVideo ? `<div class="call-avatar">${initials(name)}</div>` : `<div></div>`}
    <div class="call-controls">
      <button class="call-btn" id="call-mute"><i data-lucide="mic"></i></button>
      <button class="call-btn end" id="call-end"><i data-lucide="phone-off"></i></button>
      ${isVideo ? `<button class="call-btn" id="call-camera"><i data-lucide="video"></i></button>` : ""}
    </div>`;
  document.body.appendChild(el);
  if (window.lucide) lucide.createIcons();

  if (isVideo) {
    el.querySelector(".remote-video").srcObject = remoteStream;
    el.querySelector(".local-video").srcObject = localStream;
  } else {
    // для голосовых звонков видео-элемента нет — без этого звук собеседника никуда не подключён и его не слышно
    el.querySelector(".remote-audio").srcObject = remoteStream;
  }

  let seconds = 0, timerInt = null;
  const startTimer = () => { timerInt = setInterval(()=>{ seconds++; const m=String(Math.floor(seconds/60)).padStart(2,"0"), s=String(seconds%60).padStart(2,"0"); const t=document.getElementById("call-timer"); if(t) t.textContent=`${m}:${s}`; }, 1000); };
  if (!outgoing) startTimer(); else setTimeout(startTimer, 1500);

  let muted = false;
  document.getElementById("call-mute").addEventListener("click", function(){
    muted = !muted;
    localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    this.style.background = muted ? "#fff" : "rgba(255,255,255,.2)";
    this.style.color = muted ? "#000" : "#fff";
  });

  if (isVideo) {
    let cameraOff = false;
    document.getElementById("call-camera").addEventListener("click", function(){
      cameraOff = !cameraOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !cameraOff);
      this.querySelector("i").setAttribute("data-lucide", cameraOff ? "video-off" : "video");
      if (window.lucide) lucide.createIcons();
      const localVideoEl = el.querySelector(".local-video");
      if (localVideoEl) localVideoEl.style.opacity = cameraOff ? 0.15 : 1;
    });
  }

  document.getElementById("call-end").addEventListener("click", () => endCall(true));
}

async function endCall(updateFirestore){
  stopRingback();
  document.getElementById("call-screen")?.remove();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  if (updateFirestore && activeCallId) await db.collection("calls").doc(activeCallId).update({ status: "ended" }).catch(()=>{});
  if (callDocUnsub) callDocUnsub();
  pc = null; localStream = null; activeCallId = null;
}

/* ==== js/stickers.js ==== */
/* ---------------- СТИКЕРЫ ----------------
   stickers/{id}: { ownerId, url, createdAt }
   Свои стикеры — просто загруженные картинки (PNG с прозрачностью выглядят лучше всего,
   но подойдёт любое изображение). Автоматического удаления фона тут нет — это отдельная
   ML-задача, для нормального результата нужен готовый сервис вроде remove.bg.
*/

async function getMyStickers(){
  const snap = await db.collection("stickers").where("ownerId","==",currentUser.uid).orderBy("createdAt","desc").get();
  const stickers = [];
  snap.forEach(d => stickers.push({ id: d.id, ...d.data() }));
  return stickers;
}

async function uploadSticker(file){
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `stickers/${currentUser.uid}_${Date.now()}_${safeName}`;
  const url = await uploadToSupabase(path, file);
  await db.collection("stickers").add({
    ownerId: currentUser.uid, url,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
}

async function deleteSticker(stickerId){
  await db.collection("stickers").doc(stickerId).delete();
}

async function sendSticker(url){
  await addMessage({ type: "sticker", mediaUrl: url });
}

function openStickerPicker(){
  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML = `<div class="card modal-sheet">
    <div class="modal-drag"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="font-weight:700">Стикеры</h3>
      <button class="icon-btn" id="sticker-add-btn"><i data-lucide="plus"></i></button>
    </div>
    <input type="file" id="sticker-file-input" accept="image/*" style="display:none" />
    <div id="sticker-grid" class="sticker-grid">
      <div style="grid-column:1/-1;text-align:center;color:var(--sub);padding:20px;font-size:13px">Загрузка...</div>
    </div>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);
  if (window.lucide) lucide.createIcons();
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

  document.getElementById("sticker-add-btn").addEventListener("click", () => document.getElementById("sticker-file-input").click());
  document.getElementById("sticker-file-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById("sticker-add-btn").innerHTML = `<i data-lucide="loader"></i>`;
    try {
      await uploadSticker(file);
    } catch (err) {
      console.error("Ошибка загрузки стикера:", err);
      alert(err.message || String(err));
    }
    if (window.lucide) lucide.createIcons();
    renderStickerGrid();
  });

  function renderStickerGrid(){
    getMyStickers().then(stickers => {
      const grid = document.getElementById("sticker-grid");
      if (window.lucide) lucide.createIcons();
      if (stickers.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--sub);padding:24px 10px;font-size:13px">
          Своих стикеров пока нет.<br/>Жми "+" вверху, чтобы загрузить картинку — из неё получится стикер.</div>`;
        return;
      }
      grid.innerHTML = stickers.map(s => `
        <div class="sticker-tile">
          <img src="${s.url}" onclick="sendSticker('${s.url}'); document.querySelector('.modal-overlay').remove();" />
          <button class="sticker-delete" onclick="event.stopPropagation(); deleteStickerConfirm('${s.id}')"><i data-lucide="x"></i></button>
        </div>`).join("");
      if (window.lucide) lucide.createIcons();
    });
  }
  renderStickerGrid();
  window._refreshStickerGrid = renderStickerGrid;
}

function deleteStickerConfirm(stickerId){
  if (confirm("Удалить этот стикер?")) {
    deleteSticker(stickerId).then(() => window._refreshStickerGrid && window._refreshStickerGrid());
  }
}
