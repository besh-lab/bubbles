const FRAME_LABELS = {
  gold: "Золото", neon_teal: "Неон бирюза", neon_pink: "Неон розовый",
  silver: "Серебро", fire: "Огонь", rainbow: "Радуга",
};

function resolveFrameUrl(person){
  if (!person) return null;
  if (person.frameUrl) return person.frameUrl;
  if (person.frameId && FRAME_PRESETS[person.frameId]) return FRAME_PRESETS[person.frameId];
  return null;
}

// единая отрисовка аватарки с рамкой (или без) — используется везде по приложению
function renderAvatar(person, size){
  const frame = resolveFrameUrl(person);
  const bg = avatarBg(person);
  const inner = avatarInner(person);
  const fontSize = Math.round(size * 0.34);
  if (!frame) {
    return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;${bg}">${inner}</div>`;
  }
  const frameSize = Math.round(size * 1.22);
  const offset = Math.round((frameSize - size) / 2);
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <div class="avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;${bg}">${inner}</div>
    <img src="${frame}" style="position:absolute;top:-${offset}px;left:-${offset}px;width:${frameSize}px;height:${frameSize}px;pointer-events:none;z-index:2" />
  </div>`;
}

async function setProfileFramePreset(frameId){
  await db.collection("users").doc(currentUser.uid).update({
    frameId, frameUrl: firebase.firestore.FieldValue.delete(),
  });
  myProfile.frameId = frameId;
  delete myProfile.frameUrl;
}

async function uploadCustomFrame(file){
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `frames/${currentUser.uid}_${Date.now()}_${safeName}`;
  const url = await uploadToSupabase(path, file);
  await db.collection("users").doc(currentUser.uid).update({
    frameUrl: url, frameId: firebase.firestore.FieldValue.delete(),
  });
  myProfile.frameUrl = url;
  delete myProfile.frameId;
}

async function removeProfileFrame(){
  await db.collection("users").doc(currentUser.uid).update({
    frameId: firebase.firestore.FieldValue.delete(),
    frameUrl: firebase.firestore.FieldValue.delete(),
  });
  delete myProfile.frameId;
  delete myProfile.frameUrl;
}


/* ==== js/canvas.js ==== */
/* ---------------- ХОЛСТ ПРОФИЛЯ ----------------
   users/{uid}.canvas = { items: [{id,url,x,y,w,h}], drawingUrl: string|null }
   items — фото/гифки, свободно расположенные на холсте (drag & resize)
   drawingUrl — рисунок поверх, единым растровым слоем на весь холст (PNG)

   Важная честная оговорка: это не бесконечный векторный редактор — рисунок
   хранится как один плоский PNG-слой (без отмены отдельных мазков/истории),
   а элементы (фото/гифки) — с координатами и размером, без поворота.
   Для личного профиля этого с запасом достаточно.
*/

const CANVAS_BOARD_WIDTH = 460;
const CANVAS_BOARD_HEIGHT = 1400;

function renderProfileCanvasView(containerId, canvasData){
  const container = document.getElementById(containerId);
  if (!container) return;
  const data = canvasData || {};
  const items = data.items || [];
  const empty = items.length === 0 && !data.drawingUrl;
  container.innerHTML = `
    <div class="canvas-scroll">
      <div class="canvas-board" style="height:${CANVAS_BOARD_HEIGHT}px">
        ${items.map(it => `<img src="${it.url}" style="position:absolute;left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;object-fit:cover;border-radius:6px" />`).join("")}
        ${data.drawingUrl ? `<img src="${data.drawingUrl}" style="position:absolute;left:0;top:0;width:${CANVAS_BOARD_WIDTH}px;height:${CANVAS_BOARD_HEIGHT}px;pointer-events:none" />` : ""}
        ${empty ? `<div style="padding:40px 20px;text-align:center;color:#555;font-size:13px">Холст профиля пока пуст</div>` : ""}
      </div>
    </div>`;
}

let canvasEditorState = null;

function openCanvasEditor(){
  const existing = myProfile.canvas || { items: [], drawingUrl: null };
  canvasEditorState = {
    items: JSON.parse(JSON.stringify(existing.items || [])),
    drawMode: false,
  };

  const overlay = document.createElement("div");
  overlay.id = "canvas-editor-overlay";
  overlay.className = "canvas-editor-overlay";
  overlay.innerHTML = `
    <div class="canvas-editor-toolbar">
      <button class="icon-btn" id="canvas-close-btn"><i data-lucide="x"></i></button>
      <button class="btn-secondary" id="canvas-add-btn" style="font-size:12px;padding:7px 10px">+ Фото/GIF</button>
      <button class="btn-secondary" id="canvas-draw-btn" style="font-size:12px;padding:7px 10px">✏️ Рисовать</button>
      <button class="btn-primary" id="canvas-save-btn" style="font-size:12px;padding:7px 14px;margin-left:auto">Готово</button>
    </div>
    <div id="canvas-draw-tools" class="canvas-draw-tools" style="display:none">
      ${["#ffffff","#FA5151","#FFB86C","#95EC69","#4C8CFF","#7C6CFF"].map(c=>`<div class="draw-color ${c==="#ffffff"?"selected":""}" style="background:${c}" data-color="${c}"></div>`).join("")}
      <div style="flex:1"></div>
      <button class="btn-secondary" id="canvas-clear-draw-btn" style="font-size:11px;padding:5px 10px">Очистить рисунок</button>
    </div>
    <input type="file" id="canvas-file-input" accept="image/*" style="display:none" multiple />
    <div class="canvas-scroll" id="canvas-editor-scroll">
      <div class="canvas-board" id="canvas-editor-board" style="height:${CANVAS_BOARD_HEIGHT}px;width:${CANVAS_BOARD_WIDTH}px">
        <canvas id="canvas-draw-layer" width="${CANVAS_BOARD_WIDTH}" height="${CANVAS_BOARD_HEIGHT}" style="position:absolute;left:0;top:0;pointer-events:none"></canvas>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  if (window.lucide) lucide.createIcons();

  const board = document.getElementById("canvas-editor-board");
  const drawCanvas = document.getElementById("canvas-draw-layer");
  const dctx = drawCanvas.getContext("2d");

  if (existing.drawingUrl) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => dctx.drawImage(img, 0, 0, CANVAS_BOARD_WIDTH, CANVAS_BOARD_HEIGHT);
    img.src = existing.drawingUrl;
  }

  let drawColor = "#ffffff";
  let drawing = false;

  function boardPoint(e){
    const rect = board.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  drawCanvas.addEventListener("pointerdown", (e) => {
    if (!canvasEditorState.drawMode) return;
    drawing = true;
    const { x, y } = boardPoint(e);
    dctx.beginPath();
    dctx.moveTo(x, y);
    dctx.strokeStyle = drawColor;
    dctx.lineWidth = 4;
    dctx.lineCap = "round";
    dctx.lineJoin = "round";
  });
  drawCanvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const { x, y } = boardPoint(e);
    dctx.lineTo(x, y);
    dctx.stroke();
  });
  window.addEventListener("pointerup", () => { drawing = false; });

  function renderItems(){
    board.querySelectorAll(".canvas-item").forEach(el => el.remove());
    canvasEditorState.items.forEach(item => {
      const el = document.createElement("div");
      el.className = "canvas-item";
      el.style.cssText = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;`;
      el.innerHTML = `<img src="${item.url}" draggable="false" /><div class="canvas-item-delete">✕</div><div class="canvas-item-resize"></div>`;
      board.insertBefore(el, drawCanvas);
      wireItemDrag(el, item);
    });
  }

  function wireItemDrag(el, item){
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    el.addEventListener("pointerdown", (e) => {
      if (canvasEditorState.drawMode) return;
      if (e.target.closest(".canvas-item-resize") || e.target.closest(".canvas-item-delete")) return;
      dragging = true;
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origX = item.x; origY = item.y;
    });
    el.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      item.x = Math.max(0, origX + (e.clientX - startX));
      item.y = Math.max(0, origY + (e.clientY - startY));
      el.style.left = item.x + "px";
      el.style.top = item.y + "px";
    });
    el.addEventListener("pointerup", () => { dragging = false; });

    el.querySelector(".canvas-item-delete").addEventListener("pointerdown", (e) => e.stopPropagation());
    el.querySelector(".canvas-item-delete").addEventListener("click", (e) => {
      e.stopPropagation();
      canvasEditorState.items = canvasEditorState.items.filter(i => i.id !== item.id);
      renderItems();
    });

    const handle = el.querySelector(".canvas-item-resize");
    let resizing = false, rStartX = 0, rStartY = 0, origW = 0, origH = 0;
    handle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      resizing = true;
      handle.setPointerCapture(e.pointerId);
      rStartX = e.clientX; rStartY = e.clientY;
      origW = item.w; origH = item.h;
    });
    handle.addEventListener("pointermove", (e) => {
      if (!resizing) return;
      item.w = Math.max(40, origW + (e.clientX - rStartX));
      item.h = Math.max(40, origH + (e.clientY - rStartY));
      el.style.width = item.w + "px";
      el.style.height = item.h + "px";
    });
    handle.addEventListener("pointerup", () => { resizing = false; });
  }

  renderItems();

  document.getElementById("canvas-close-btn").addEventListener("click", () => {
    if (confirm("Закрыть без сохранения?")) overlay.remove();
  });

  document.getElementById("canvas-add-btn").addEventListener("click", () => document.getElementById("canvas-file-input").click());
  document.getElementById("canvas-file-input").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files);
    const addBtn = document.getElementById("canvas-add-btn");
    addBtn.textContent = "Загрузка...";
    try {
      for (const file of files) {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `canvas/${currentUser.uid}_${Date.now()}_${safeName}`;
        const url = await uploadToSupabase(path, file);
        canvasEditorState.items.push({ id: "it_" + Date.now() + Math.random().toString(36).slice(2,6), url, x: 20, y: 20, w: 140, h: 140 });
      }
    } catch (err) {
      console.error("Ошибка загрузки на холст:", err);
      alert(err.message || String(err));
    }
    addBtn.textContent = "+ Фото/GIF";
    renderItems();
    e.target.value = "";
  });

  const drawBtn = document.getElementById("canvas-draw-btn");
  drawBtn.addEventListener("click", () => {
    canvasEditorState.drawMode = !canvasEditorState.drawMode;
    drawCanvas.style.pointerEvents = canvasEditorState.drawMode ? "auto" : "none";
    document.getElementById("canvas-draw-tools").style.display = canvasEditorState.drawMode ? "flex" : "none";
    drawBtn.style.background = canvasEditorState.drawMode ? "var(--accent)" : "";
    drawBtn.style.color = canvasEditorState.drawMode ? "#fff" : "";
  });
  document.querySelectorAll(".draw-color").forEach(el => el.addEventListener("click", () => {
    drawColor = el.dataset.color;
    document.querySelectorAll(".draw-color").forEach(x => x.classList.remove("selected"));
    el.classList.add("selected");
  }));
  document.getElementById("canvas-clear-draw-btn").addEventListener("click", () => {
    if (confirm("Стереть весь рисунок?")) dctx.clearRect(0, 0, CANVAS_BOARD_WIDTH, CANVAS_BOARD_HEIGHT);
  });

  document.getElementById("canvas-save-btn").addEventListener("click", async () => {
    const saveBtn = document.getElementById("canvas-save-btn");
    saveBtn.textContent = "Сохранение...";
    saveBtn.disabled = true;
    try {
      const blank = isCanvasBlank(dctx, CANVAS_BOARD_WIDTH, CANVAS_BOARD_HEIGHT);
      let drawingUrl = null;
      if (!blank) {
        const dataUrl = drawCanvas.toDataURL("image/png");
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], `drawing_${Date.now()}.png`, { type: "image/png" });
        const path = `canvas/${currentUser.uid}_drawing_${Date.now()}.png`;
        drawingUrl = await uploadToSupabase(path, file);
      }
      const canvasPayload = { items: canvasEditorState.items, drawingUrl };
      await db.collection("users").doc(currentUser.uid).update({ canvas: canvasPayload });
      myProfile.canvas = canvasPayload;
      overlay.remove();
      renderProfileView(true);
    } catch (err) {
      console.error("Ошибка сохранения холста:", err);
      alert("Не получилось сохранить холст: " + (err.message || err));
      saveBtn.textContent = "Готово";
      saveBtn.disabled = false;
    }
  });
}

function isCanvasBlank(ctx, w, h){
  const data = ctx.getImageData(0, 0, w, h).data;
  for (let i = 3; i < data.length; i += 4) { if (data[i] !== 0) return false; }
  return true;
}

/* ---------- CHAT INPUT: текст, вложения, голос/видео-кружки ---------- */

function wireChatInput(){
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("btn-send");
  const voiceBtn = document.getElementById("btn-voice");
  const attachBtn = document.getElementById("btn-attach");
  const attachTray = document.getElementById("chat-attach-tray");
  const fileInput = document.getElementById("file-input");

  function autoGrow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }

  function refresh(){
    const hasText = input.value.trim().length > 0;
    sendBtn.style.display = hasText ? "flex" : "none";
    voiceBtn.style.display = hasText ? "none" : "flex";
    autoGrow();
  }
  input.addEventListener("input", refresh);
  refresh();

  sendBtn.addEventListener("click", async () => {
    const text = input.value; input.value = ""; refresh();
    await sendTextMessage(text);
  });
  // Enter/Shift+Enter намеренно НЕ отправляют сообщение — просто переносят строку (стандартное
  // поведение textarea). Отправка — только явным тапом по кнопке отправки.

  attachBtn.addEventListener("click", () => {
    if (attachTray.style.display === "none") {
      attachTray.style.display = "flex";
      attachTray.innerHTML = `
        <div class="attach-opt" id="attach-media"><i data-lucide="image"></i>Фото/Видео</div>
        <div class="attach-opt" id="attach-file"><i data-lucide="file-text"></i>Файл</div>
        <div class="attach-opt" id="attach-video-circle"><i data-lucide="video"></i>Видео-кружок</div>
        <div class="attach-opt" id="attach-sticker"><i data-lucide="smile"></i>Стикер</div>`;
      if (window.lucide) lucide.createIcons();
      document.getElementById("attach-media").addEventListener("click", () => { fileInput.accept = "image/*,video/*"; fileInput.click(); });
      document.getElementById("attach-file").addEventListener("click", () => { fileInput.accept = "*"; fileInput.click(); });
      document.getElementById("attach-video-circle").addEventListener("click", () => { openCircleRecorder(); attachTray.style.display = "none"; });
      document.getElementById("attach-sticker").addEventListener("click", () => { openStickerPicker(); attachTray.style.display = "none"; });
    } else {
      attachTray.style.display = "none";
    }
  });

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (file) await sendImageOrFile(file);
    fileInput.value = "";
    attachTray.style.display = "none";
  });

  // голосовое — удержание кнопки: начать запись, отпустить — отправить
  let recStartTime = 0, recTimerInt = null;
  const startVoice = async (e) => {
    e.preventDefault();
    try {
      await startRecording(false);
      voiceBtn.classList.add("recording");
      recStartTime = Date.now();
      showRecIndicator();
      recTimerInt = setInterval(() => updateRecIndicator((Date.now() - recStartTime) / 1000), 200);
    } catch (err) {
      console.error("Ошибка микрофона:", err);
      alert("Не получилось включить микрофон: " + (err.message || err));
    }
  };
  const stopVoice = async () => {
    if (!voiceBtn.classList.contains("recording")) return;
    voiceBtn.classList.remove("recording");
    clearInterval(recTimerInt);
    hideRecIndicator();
    const dur = (Date.now() - recStartTime) / 1000;
    if (dur < 1) { mediaRecorder.stream.getTracks().forEach(t=>t.stop()); return; }
    await stopRecordingAndSend(false, dur);
  };
  voiceBtn.addEventListener("mousedown", startVoice);
  voiceBtn.addEventListener("touchstart", startVoice);
  voiceBtn.addEventListener("mouseup", stopVoice);
  voiceBtn.addEventListener("touchend", stopVoice);
  voiceBtn.addEventListener("mouseleave", stopVoice); // отвели палец/курсор за пределы кнопки — тоже стоп
}

function showRecIndicator(){
  hideRecIndicator();
  const inputRow = document.querySelector(".chat-input-row");
  const el = document.createElement("div");
  el.id = "rec-indicator";
  el.className = "rec-indicator";
  el.innerHTML = `<span class="rec-dot"></span><span id="rec-timer">0:00</span><span style="color:var(--sub);font-size:12px;margin-left:6px">Отпусти, чтобы отправить</span>`;
  inputRow.insertAdjacentElement("beforebegin", el);
}
function updateRecIndicator(seconds){
  const t = document.getElementById("rec-timer");
  if (!t) return;
  const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
  t.textContent = `${m}:${String(s).padStart(2,"0")}`;
}
function hideRecIndicator(){
  document.getElementById("rec-indicator")?.remove();
}

function openCircleRecorder(){
  const modal = document.createElement("div");
  modal.className = "modal-overlay center";
  modal.innerHTML = `<div class="card modal-sheet card2" style="text-align:center;max-width:300px;padding:16px">
    <p style="font-weight:600;margin-bottom:10px">Видео-кружок</p>
    <div style="position:relative;width:220px;height:220px;margin:0 auto 12px;border-radius:50%;overflow:hidden;background:#000">
      <video id="circle-preview" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video>
      <div id="circle-rec-timer" style="display:none;position:absolute;top:10px;left:0;right:0;justify-content:center;align-items:center;gap:6px">
        <span class="rec-dot"></span><span id="circle-rec-timer-text" style="color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)">0:00</span>
      </div>
      <button id="circle-flip-btn" style="position:absolute;bottom:6px;right:6px;width:32px;height:32px;border-radius:8px;border:none;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center"><i data-lucide="refresh-cw" style="width:15px;height:15px"></i></button>
    </div>
    <div id="circle-rec-status" style="font-size:13px;color:var(--sub);margin-bottom:12px">Готово к записи</div>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" style="flex:1" id="circle-cancel-btn">Отмена</button>
      <button class="btn-primary" style="flex:1" id="circle-rec-btn">Начать</button>
    </div>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);
  if (window.lucide) lucide.createIcons();

  let previewStream = null, recording = false, start = 0, facingMode = "user", circleTimerInt = null;

  async function openPreview(){
    if (previewStream) previewStream.getTracks().forEach(t => t.stop());
    try {
      previewStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 320, facingMode }, audio: true });
      const video = document.getElementById("circle-preview");
      video.srcObject = previewStream;
      // фронтальную камеру зеркалим (привычный вид "как в зеркале"), заднюю — нет
      video.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";
    } catch (err) {
      console.error("Ошибка камеры:", err);
      alert("Не получилось включить камеру: " + (err.message || err));
      modal.remove();
    }
  }
  openPreview();

  document.getElementById("circle-flip-btn").addEventListener("click", () => {
    if (recording) return; // переключать камеру во время записи не даём — проще и надёжнее
    facingMode = facingMode === "user" ? "environment" : "user";
    openPreview();
  });

  document.getElementById("circle-cancel-btn").addEventListener("click", () => {
    if (previewStream) previewStream.getTracks().forEach(t => t.stop());
    modal.remove();
  });

  document.getElementById("circle-rec-btn").addEventListener("click", async function(){
    if (!recording) {
      document.getElementById("circle-flip-btn").style.display = "none";
      startRecordingFromStream(previewStream, true);
      recording = true; start = Date.now();
      this.textContent = "Остановить";
      document.getElementById("circle-rec-status").textContent = "Идёт запись...";
      const timerEl = document.getElementById("circle-rec-timer");
      timerEl.style.display = "flex";
      circleTimerInt = setInterval(() => {
        const sec = (Date.now() - start) / 1000;
        const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
        document.getElementById("circle-rec-timer-text").textContent = `${m}:${String(s).padStart(2,"0")}`;
      }, 200);
    } else {
      clearInterval(circleTimerInt);
      this.disabled = true;
      const dur = (Date.now() - start) / 1000;
      await stopRecordingAndSend(true, dur);
      modal.remove();
    }
  });
}

  modal.className = "modal-overlay center";
  modal.innerHTML = `<div class="card modal-sheet card2" style="max-width:320px;text-align:center;padding:22px">
    <h3 style="font-weight:700;margin-bottom:4px">Мой QR-код</h3>
    <p style="font-size:12px;color:var(--sub);margin-bottom:16px">${myProfile.username||""}</p>
    <div id="qr-canvas" style="width:190px;height:190px;margin:0 auto;background:#fff;border-radius:10px;padding:10px;border:1px solid var(--border)"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-secondary" style="flex:1" id="qr-copy-btn">Скопировать ссылку</button>
      <button class="btn-secondary" style="flex:1" id="qr-scan-btn">Сканировать</button>
    </div>
    <button class="btn-primary full" style="margin-top:8px" onclick="this.closest('.modal-overlay').remove()">Готово</button>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
  new QRCode(document.getElementById("qr-canvas"), { text: link, width: 170, height: 170 });
  document.getElementById("qr-copy-btn").addEventListener("click", async () => {
    await navigator.clipboard.writeText(link);
    document.getElementById("qr-copy-btn").textContent = "Скопировано!";
    setTimeout(() => { document.getElementById("qr-copy-btn").textContent = "Скопировать ссылку"; }, 1500);
  });
  document.getElementById("qr-scan-btn").addEventListener("click", () => { modal.remove(); openQRScanner(); });
}

function openQRScanner(){
  const modal = document.createElement("div");
  modal.className = "modal-overlay center";
  modal.style.background = "#000";
  modal.innerHTML = `<div style="width:100%;text-align:center;color:#fff">
    <video id="qr-video" style="width:100%;max-width:400px;border-radius:10px;background:#111" playsinline muted autoplay></video>
    <canvas id="qr-canvas-hidden" style="display:none"></canvas>
    <p style="margin-top:14px;font-size:13px">Наведи камеру на QR-код друга</p>
    <button class="btn-secondary" style="margin-top:14px" id="qr-scan-close">Отмена</button>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);

  const video = document.getElementById("qr-video");
  const canvas = document.getElementById("qr-canvas-hidden");
  const ctx = canvas.getContext("2d");
  let stream, scanning = true;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }).then(s => {
    stream = s;
    video.srcObject = s;
    // play() может быть отклонён без явного muted/autoplay — ловим и логируем, а не проглатываем молча
    video.play().catch(err => console.error("Не удалось запустить видео камеры:", err));
    requestAnimationFrame(tick);
  }).catch(err => {
    console.error("Ошибка камеры:", err);
    alert("Не получилось включить камеру: " + (err.message || err.name || err));
    modal.remove();
  });

  function tick(){
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        let uid = null;
        try {
          const url = new URL(code.data);
          uid = url.searchParams.get("add");
        } catch { if (code.data.startsWith("bubbles:")) uid = code.data.replace("bubbles:",""); }
        if (uid) {
          scanning = false;
          stream.getTracks().forEach(t => t.stop());
          modal.remove();
          openOrCreateDm(uid);
          return;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  document.getElementById("qr-scan-close").addEventListener("click", () => {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    modal.remove();
  });
}

    <div class="avatar" style="width:70px;height:70px;font-size:26px;margin:0 auto 12px;background:linear-gradient(135deg,#4C8CFF,#7C6CFF)">📢</div>

    <button class="btn-primary full" id="channel-preview-btn" style="margin-top:14px">${isSubscribed ? "Открыть" : "Подписаться и открыть"}</button>

function openUserSearchModal(){
  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML = `<div class="card modal-sheet">
    <div class="modal-drag"></div>
    <h3 style="font-weight:700;margin-bottom:14px">Найти по нику</h3>
    <input id="user-search-input" class="input" placeholder="Никнейм пользователя..." />
    <div id="user-search-results" class="list"></div>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
  document.getElementById("user-search-input").addEventListener("input", async (e) => {
    const q = e.target.value.trim().replace(/^@/,"").toLowerCase();
    const results = document.getElementById("user-search-results");
    if (!q) { results.innerHTML = ""; return; }
    const snap = await db.collection("users")
      .where("username", ">=", "@"+q).where("username", "<=", "@"+q+"\uf8ff").limit(10).get();
    results.innerHTML = "";
    snap.forEach(d => {
      const u = d.data();
      if (u.uid === currentUser.uid) return;
      if (isBlocked(u.uid)) return; // заблокированных не предлагаем в поиске
      const row = document.createElement("div");
      row.className = "list-row";
      row.innerHTML = `${renderAvatar(u, 40)}<div class="list-row-body"><div class="list-row-name">${escapeHtml(displayNameFor(u.uid, u.name))}</div><div style="font-size:12px;color:var(--sub)">${u.username}</div></div>`;
      row.addEventListener("click", () => { modal.remove(); openOrCreateDm(u.uid); });
      results.appendChild(row);
    });
  });
}

// список людей, с которыми уже есть личные чаты — источник для выбора участников группы
async function getKnownContacts(){
  const snap = await db.collection("chats").where("members","array-contains",currentUser.uid).get();
  const uids = new Set();
  snap.forEach(d => {
    const c = d.data();
    if (c.type === "dm") { const other = c.members.find(m => m !== currentUser.uid); if (other) uids.add(other); }
  });
  const contacts = [];
  for (const uid of uids) {
    const profile = await getUserProfile(uid);
    if (profile && !isBlocked(uid)) contacts.push({ uid, ...profile });
  }
  return contacts;
}

function openCreateGroupModal(){
  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.innerHTML = `<div class="card modal-sheet" style="max-height:82vh;display:flex;flex-direction:column">
    <div class="modal-drag"></div>
    <h3 style="font-weight:700;margin-bottom:12px">Новая группа</h3>
    <input id="group-name-input" class="input" placeholder="Название группы" />
    <div style="font-size:12px;color:var(--sub);margin:2px 0 8px">Участники — из тех, с кем уже переписывались:</div>
    <div id="group-contacts-list" class="list" style="flex:1;overflow-y:auto;margin-bottom:12px">
      <div style="text-align:center;color:var(--sub);padding:20px;font-size:13px">Загрузка...</div>
    </div>
    <button class="btn-primary full" id="group-create-btn" disabled style="opacity:.5">Создать (0)</button>
  </div>`;
  document.getElementById("modal-root").appendChild(modal);
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

  const selected = new Set();
  const createBtn = document.getElementById("group-create-btn");
  function refreshCreateBtn(){
    const name = document.getElementById("group-name-input").value.trim();
    createBtn.textContent = `Создать (${selected.size})`;
    const ok = !!name && selected.size > 0;
    createBtn.disabled = !ok;
    createBtn.style.opacity = ok ? 1 : .5;
  }
  document.getElementById("group-name-input").addEventListener("input", refreshCreateBtn);

  getKnownContacts().then(contacts => {
    const list = document.getElementById("group-contacts-list");
    if (contacts.length === 0) {
      list.innerHTML = `<div style="text-align:center;color:var(--sub);padding:20px;font-size:13px">Пока не с кем — сначала напиши кому-нибудь через поиск по нику</div>`;
      return;
    }
    list.innerHTML = contacts.map(c => `
      <div class="list-row" data-uid="${c.uid}" style="cursor:pointer">
        ${renderAvatar(c, 40)}
        <div class="list-row-body"><div class="list-row-name">${escapeHtml(displayNameFor(c.uid, c.name))}</div></div>
        <div class="group-check" data-check="${c.uid}"></div>
      </div>`).join("");
    list.querySelectorAll(".list-row").forEach(row => {
      row.addEventListener("click", () => {
        const uid = row.dataset.uid;
        const check = row.querySelector(".group-check");
        if (selected.has(uid)) { selected.delete(uid); check.classList.remove("checked"); }
        else { selected.add(uid); check.classList.add("checked"); }
        refreshCreateBtn();
      });
    });
  });

  createBtn.addEventListener("click", () => {
    const name = document.getElementById("group-name-input").value.trim();
    if (!name || selected.size === 0) return;
    modal.remove();
    createGroupChat(name, [...selected]);
  });
}
